services:
  yspl:
    image: yspl-rs:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yspl
    restart: unless-stopped
    network_mode: host
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 1.1.1.1
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - YSP_DATA_DIR=/app/data
      - NODE_OPTIONS="--max-old-space-size=256 --optimize-for-size"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
