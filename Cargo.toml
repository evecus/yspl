[package]
name = "yspl"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "央视频全频道直播代理（yspl v0.1.0 全量 1:1 Rust 重写）"
license = "MIT"

[[bin]]
name = "yspl"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "cookies", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
flate2 = "1"
rand = "0.8"
url = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytes = "1"
futures-util = "0.3"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
